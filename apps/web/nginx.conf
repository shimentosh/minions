# Serves the web app and proxies /api/* to the API container (as /*).
# TLS ends at the reverse proxy in front (Traefik in Dokploy).

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  # Docker's DNS, re-resolved, so nginx starts even while the API is still booting.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://minions-api:4600;

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    # The API accepts JSON bodies up to 3 MB (imports, backups).
    client_max_body_size 4m;
    proxy_read_timeout 60s;
    # The API sets its own security and cache headers.
  }

  # Hashed file names: cache for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Single-page app: unknown paths get index.html, which must never be cached
  # (it names the current asset files and carries the CSP).
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
